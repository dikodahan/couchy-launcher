import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

gradle.projectsEvaluated {
    rootProject.tasks.register('dependencyInventory') {
        doLast {
            def inventory = [:]
            def unresolved = []
            rootProject.allprojects.each { project ->
                // Include auxiliary Android/UTP/compiler configurations as well as packaged runtime code.
                def selected = project.configurations.findAll { it.canBeResolved } +
                    project.buildscript.configurations.findAll { it.name == 'classpath' }
                selected.findAll { it.canBeResolved }.each { configuration ->
                    def resolution = configuration.incoming.resolutionResult
                    resolution.allDependencies.findAll { it instanceof UnresolvedDependencyResult }.each { dependency ->
                        unresolved.add("${project.path}:${configuration.name}: ${dependency.attempted.displayName}: ${dependency.failure.message}")
                    }
                    resolution.allComponents.each { component ->
                        if (component.id instanceof ModuleComponentIdentifier) {
                            def id = component.id
                            def key = "${id.group}:${id.module}:${id.version}".toString()
                            def row = inventory.computeIfAbsent(key) { [name: "${id.group}:${id.module}".toString(), version: id.version, configurations: []] }
                            row.configurations.add("${project.path}:${configuration.name}".toString())
                        }
                    }
                }
            }
            if (!unresolved.isEmpty()) {
                throw new GradleException("Dependency audit inventory is incomplete:\n" + unresolved.unique().join("\n"))
            }
            def target = new File(rootProject.buildDir, 'reports/dependencies/inventory.json')
            target.parentFile.mkdirs()
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson(inventory.values().toList().sort { it.name }))
            println "Dependency inventory: ${target} (${inventory.size()} modules)"
        }
    }
}
